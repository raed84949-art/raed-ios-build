name: Build RaedTranslate IPA
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          # کردنەوەی فایلە Zipـەکە
          unzip ios.zip
          
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Find Workspace and Build
        run: |
          # گەڕان بەدوای فایلەکەدا لەناو ئەو شتانەی کە Extract کراون
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" | head -n 1)
          SCHEME_NAME=$(basename "$WORKSPACE_PATH" .xcworkspace)
          
          echo "Found workspace at: $WORKSPACE_PATH"
          
          xcodebuild archive \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -archivePath $PWD/build/RaedTranslate.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Create Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/RaedTranslate.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r RaedTranslate_Unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RaedTranslate-Package
          path: build/RaedTranslate_Unsigned.ipa
